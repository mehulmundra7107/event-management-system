<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Event Management System</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            display: flex;
            align-items: stretch;
        }

        .bg-left {
            flex: 0 0 28vw;
            background: url('images/coep_campus.png') right bottom / cover no-repeat;
            -webkit-mask-image: linear-gradient(to right, black 60%, transparent 100%);
                    mask-image: linear-gradient(to right, black 60%, transparent 100%);
        }

        .bg-centre {
            flex: 1;
            background: #dce8f5;
        }

        .bg-right {
            flex: 0 0 28vw;
            background: url('images/coep_bell_tower.png') left bottom / cover no-repeat;
            -webkit-mask-image: linear-gradient(to left, black 60%, transparent 100%);
                    mask-image: linear-gradient(to left, black 60%, transparent 100%);
        }

        nav {
            position: relative;
            z-index: 10;
        }

        .container {
            position: relative;
            z-index: 5;
            max-width: 740px;
            margin: 28px auto;
            padding: 0 20px 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.97) !important;
            border-radius: 14px !important;
            border: 1px solid rgba(200, 215, 230, 0.9) !important;
            box-shadow: 0 8px 32px rgba(20, 40, 80, 0.13) !important;
            backdrop-filter: blur(4px);
            padding: 26px 30px !important;
            margin-bottom: 24px !important;
        }

        @media (max-width: 900px) {
            .bg-left, .bg-right { flex: 0 0 18vw; }
        }

        @media (max-width: 600px) {
            .bg-left, .bg-right { display: none; }
        }
    </style>
</head>
<body>

<!-- Full-screen COEP backdrop -->
<div class="bg-canvas">
    <div class="bg-left"></div>
    <div class="bg-centre"></div>
    <div class="bg-right"></div>
</div>

<div class="container">
    <h1>System Dashboard</h1>

    <!-- -------------------------------------------------------
         SECTION 1: Summary Metric Cards (4 Simple Counts)
    ------------------------------------------------------- -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Total Students</div>
            <div class="stat-number" id="count-students">0</div>
        </div>

        <div class="stat-card green">
            <div class="stat-label">Total Events</div>
            <div class="stat-number" id="count-events">0</div>
        </div>

        <div class="stat-card orange">
            <div class="stat-label">Total Registrations</div>
            <div class="stat-number" id="count-registrations">0</div>
        </div>

        <div class="stat-card purple">
            <div class="stat-label">Feedback Entries</div>
            <div class="stat-number" id="count-feedback">0</div>
        </div>
    </div>

    <!-- -------------------------------------------------------
         SECTION 2: Upcoming Events (Next 5)
    ------------------------------------------------------- -->
    <div class="card">
        <h2>Upcoming Events (Next 5)</h2>
        <p style="color: #666; font-size: 13px; margin-bottom: 12px;">
            Fetched dynamically from the database where <code>event_date &gt;= CURDATE()</code> ordered by date.
        </p>
        <div id="upcoming-events-container"></div>
    </div>

    <!-- -------------------------------------------------------
         Behind the Scenes box
         Shows the SQL queries and JSON returned for the dashboard.
    ------------------------------------------------------- -->
    <div id="behind-the-scenes"></div>
</div>

<!-- Load shared helpers first, then this page's logic -->
<script src="common.js"></script>
<script src="index.js"></script>

</body>
</html>
