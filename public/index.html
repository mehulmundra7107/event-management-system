<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Event Management System</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Light COEP Main Campus watermark for Dashboard */
        body {
            background-color: #f3f5f8;
            background-image:
                linear-gradient(rgba(244, 247, 251, 0.91), rgba(244, 247, 251, 0.91)),
                url('images/coep_main.png');
            background-attachment: fixed;
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            min-height: 100vh;
        }

        .container {
            position: relative;
            z-index: 2;
        }

        .bell-tower-watermark {
            position: fixed;
            right: 15px;
            bottom: 10px;
            width: 240px;
            max-width: 26vw;
            opacity: 0.16;
            pointer-events: none;
            z-index: 1;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.06));
        }

        .card {
            background: rgba(255, 255, 255, 0.97) !important;
            border-radius: 12px !important;
            border: 1px solid #dce4ec !important;
            box-shadow: 0 4px 18px rgba(44, 62, 80, 0.06) !important;
        }

        @media (max-width: 768px) {
            .bell-tower-watermark {
                display: none;
            }
        }
    </style>
</head>
<body>

<!-- Subtle COEP Bell Tower watermark on right -->
<img src="images/coep_bell_tower.png" alt="" class="bell-tower-watermark">

<div class="container">
    <h1>Dashboard</h1>
    <div class="card">
        <p>This page will be built by <strong>Member 4</strong> (Part 4).</p>
        <p>It will show summary counts (students, events, registrations, feedback) and upcoming events.</p>
    </div>
    <div id="behind-the-scenes"></div>
</div>
<script src="common.js"></script>
<script>window.onload = function() { addNavbar(); };</script>
</body>
</html>
